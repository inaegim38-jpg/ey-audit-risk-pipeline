services:
  postgres:
    image: postgres:16
    container_name: ey_audit_postgres
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: audit_admin
      POSTGRES_PASSWORD: audit_password123
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_admin -d audit_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:latest
    container_name: ey_audit_n8n
    environment:
      TZ: Asia/Seoul
      GENERIC_TIMEZONE: Asia/Seoul
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
